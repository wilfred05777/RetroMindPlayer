[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retromind-player"
version = "0.2.0"
description = "Offline local audio and video player"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.10,<7", "mutagen>=1.47,<2", "av>=16,<19"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
retromind-player = "retromind.main:main"

[tool.setuptools.package-data]
retromind = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
